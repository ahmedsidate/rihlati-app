<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B5A61"><meta name="color-scheme" content="light dark"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="رحلتي"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><title>حسابات رحلتي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: right-hand sidebar (RTL) + one content column; bottom tab bar on phones. Boldness lives in the teal cash band on the dashboard; everything else stays quiet. */
:root{
  --bg:#F1F5F5; --surface:#FFFFFF; --surface2:#E7EEEE; --ink:#10262A; --muted:#566C70; --line:#D6E0E0;
  --brand:#0B5A61; --on-brand:#FFFFFF; --brand-soft:#D9EEEE; --gold:#B5761B;
  --hero-bg:#0B5A61; --hero-fg:#FFFFFF; --hero-dim:#B9DADC;
  --good:#16794A; --good-soft:#DAF1E4; --warn:#9A5B00; --warn-soft:#FAEACB; --bad:#B3261E; --bad-soft:#F9DCD9;
  --scrim:rgba(8,22,24,.55);
  --f-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1618; --surface:#122326; --surface2:#1A2F32; --ink:#E6F0F0; --muted:#93ADB0; --line:#25393C;
    --brand:#5CC0C7; --on-brand:#04191B; --brand-soft:#173B40; --gold:#E2A94B;
    --hero-bg:#15474C; --hero-fg:#EAF7F7; --hero-dim:#9FC9CC;
    --good:#58CA8E; --good-soft:#143324; --warn:#E6AA4C; --warn-soft:#3A2D12; --bad:#F2928A; --bad-soft:#40201D;
    --scrim:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1618; --surface:#122326; --surface2:#1A2F32; --ink:#E6F0F0; --muted:#93ADB0; --line:#25393C;
  --brand:#5CC0C7; --on-brand:#04191B; --brand-soft:#173B40; --gold:#E2A94B;
  --hero-bg:#15474C; --hero-fg:#EAF7F7; --hero-dim:#9FC9CC;
  --good:#58CA8E; --good-soft:#143324; --warn:#E6AA4C; --warn-soft:#3A2D12; --bad:#F2928A; --bad-soft:#40201D;
  --scrim:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
#root{direction:rtl;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.sp{flex:1}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums;white-space:nowrap}
.boot{padding:80px 16px;text-align:center;color:var(--muted)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:18px}
.brandrow{display:flex;align-items:center;gap:10px;padding:0 6px}
.brandrow svg{flex:none}
.brandrow b{display:block;font-family:var(--f-display);font-size:18px;line-height:1.25}
.brandrow small{color:var(--muted);font-size:12px}
.side nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:start;color:var(--muted);font-weight:500;position:relative}
.nv:hover{background:var(--surface2);color:var(--ink)}
.nv[aria-current="page"]{background:var(--brand-soft);color:var(--ink);font-weight:600}
.nv[aria-current="page"]::after{content:"";position:absolute;inset-inline-end:-14px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--gold)}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:12px 6px 0;border-top:1px solid var(--line)}
.me{display:flex;align-items:center;gap:10px;min-width:0}
.me img{width:32px;height:32px;border-radius:50%;flex:none}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.rolechip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:500;cursor:default}
button.rolechip{cursor:pointer}
button.rolechip:hover{background:var(--surface2)}
.rolechip.adm{color:var(--brand);border-color:var(--brand)}
.main{padding:22px 28px 60px;min-width:0;max-width:1180px;width:100%}
.mbar{display:none}
.tabbar{display:none}
.vhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.vhead h1{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.2;flex:1;min-width:140px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-weight:500}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:transparent;background:none}
.btn.danger:hover{background:var(--bad-soft)}
.btn.danger-fill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:32px;padding:4px 12px;font-size:13px}
.btn:disabled{opacity:.6;cursor:default}
a.btn{text-decoration:none;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input,select,textarea{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);}
textarea{resize:vertical;min-height:70px}
input.num{direction:ltr;text-align:start}
input[type="search"]{min-width:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type="search"]{flex:1 1 240px}
.toolbar select{width:auto;flex:0 0 auto;min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:500;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--brand-soft);color:var(--brand)}
.neg{color:var(--bad);font-weight:600}
.pos{color:var(--good);font-weight:600}

/* dashboard */
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:14px;padding:22px 24px;display:flex;gap:24px 48px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.hero .lbl{display:block;color:var(--hero-dim);font-size:13.5px}
.hero .big{font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1.2}
.hero .mid{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.3}
.hero small{display:block;color:var(--hero-dim);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface2);border-radius:10px;padding:14px 16px;min-width:0}
.tile span{display:block;color:var(--muted);font-size:13.5px}
.tile b{display:block;font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.tile small{color:var(--muted);font-size:12.5px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card h3{font-family:var(--f-display);font-size:18px;font-weight:600;margin-bottom:10px}
.card.flush{padding:0;overflow:hidden}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;text-align:start}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.r1{flex:1;min-width:0;display:flex;flex-direction:column}
.r1 b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r1 small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r2{text-align:end;white-space:nowrap;font-size:13.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .b1{fill:var(--brand)}
.chart .b2{fill:var(--gold)}
.legend{display:flex;gap:16px;color:var(--muted);font-size:13px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px;vertical-align:-1px}

/* tables */
.tw{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-weight:600;color:var(--muted);font-size:13px;text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover{background:var(--surface2)}
.tbl td.main{font-weight:600}
.tbl td small{display:block;color:var(--muted);font-weight:400}
.foot{display:flex;gap:18px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;background:var(--surface2)}
.foot b{color:var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--brand)}

/* programs */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard h3{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.35}
.pcard .meta{color:var(--muted);font-size:13.5px}
.meter{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand)}
.meter.full i{background:var(--warn)}
.pcard .pa{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}

/* modal */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;width:min(640px,100%);max-height:calc(100dvh - 32px);overflow:auto;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet.small{width:min(420px,100%)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.sheet-h h2{font-family:var(--f-display);font-size:20px;font-weight:600;flex:1}
.x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 8px;border-radius:6px}
.x:hover{background:var(--surface2)}
.sheet-b{padding:16px 20px}
.sheet-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 20px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;padding:16px 20px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-weight:500;font-size:14px}
.fld label i{color:var(--bad);font-style:normal}
.fld small{color:var(--muted);font-size:12.5px}
.err{margin:0 20px 8px;padding:8px 12px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-weight:500}
.kvs{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0 0 14px}
.kv{min-width:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.kv.full{grid-column:1/-1}
.sheet h4{margin:14px 0 6px;font-size:15px;font-weight:600}
.cmsg{padding:8px 0;font-size:16px}
.toast{position:fixed;inset-inline:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:80;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.bad{background:var(--bad);color:#fff}
.guide{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.ro .wr{display:none!important}

@media (max-width:899px){
  .shell{display:block}
  .side{display:none}
  .mbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .mbar b{font-family:var(--f-display);font-size:17px}
  .main{padding:0 0 calc(84px + env(safe-area-inset-bottom,0px));max-width:none}
  #view{padding:16px 16px 0}
  .tabbar{display:flex;position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  .tabbar .nv{flex:1;flex-direction:column;gap:2px;font-size:11.5px;padding:6px 2px;align-items:center;text-align:center}
  .tabbar .nv[aria-current="page"]::after{inset-inline-end:auto;top:0;bottom:auto;left:30%;right:30%;width:auto;height:3px}
  .vhead h1{font-size:24px}
  .hero{padding:18px}
  .hero .big{font-size:32px}
  .grid,.kvs{grid-template-columns:1fr}
  .modal{align-items:flex-end;padding:0}
  .sheet{border-radius:16px 16px 0 0;width:100%;max-height:92dvh}
  .sheet.small{width:100%}
  .tbl thead{display:none}
  .tbl,.tbl tbody{display:block}
  .tbl tr{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .tbl tbody tr:last-child{border-bottom:0}
  .tbl td{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:1px 0;border:0}
  .tbl td::before{content:attr(data-l);color:var(--muted);font-size:12.5px;font-weight:400}
  .tbl td.main{grid-column:1/-1;font-size:16px}
  .tbl td.main::before{display:none}
  .tbl td.wide{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){
  .modal:not([hidden]) .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
}

/* documents (invoice / receipt) */
.sheet.docsheet{width:min(840px,100%)}
.docwrap{padding:16px;background:var(--surface2);overflow:auto}
.docwrap .doc{max-width:760px;margin:0 auto;padding:34px 38px;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.14)}
.dochint{color:var(--muted);font-size:13px;padding:10px 20px 0}
@media (max-width:899px){
  .docwrap{padding:8px}
  .docwrap .doc{padding:20px 16px}
  .doc-h{flex-direction:column}
  .doc-ti{text-align:start}
  .doc-grid{grid-template-columns:1fr}
}
@page{size:A4;margin:12mm}
@media print{
  html,body{background:#fff!important;overflow:visible!important}
  #app,#toast,.no-print{display:none!important}
  #root{min-height:0}
  .modal{position:static!important;inset:auto!important;background:none!important;padding:0!important;display:block!important}
  .sheet{box-shadow:none!important;max-height:none!important;overflow:visible!important;width:100%!important;border-radius:0!important;background:#fff!important;animation:none!important;display:block!important}
  .docwrap{padding:0!important;background:#fff!important;overflow:visible!important}
  .docwrap .doc{box-shadow:none!important;border-radius:0!important;max-width:none!important;padding:0!important}
}

.arow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .row{border-top:0;flex:1;min-width:0}
.arow .btn{flex:0 0 auto}
.doclang{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px 0}
.doclang>span{color:var(--muted);font-size:13px}
@media(max-width:700px){.arow{flex-wrap:wrap;padding-bottom:6px}.doclang{padding:10px 12px 0}}
@media print{.doclang{display:none!important}}
</style><style>[hidden]{display:none!important}html,body{margin:0}</style></head><body>

  <div id="app" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>
</div>

(function(){

  set:svg('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'),

};
var MARK='<svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--brand)"/><path d="M8 21c4-9 12-9 16-2" stroke="var(--on-brand)" fill="none" stroke-width="2.4" stroke-linecap="round"/><circle cx="8" cy="21" r="2.4" fill="var(--on-brand)"/><circle cx="24" cy="19" r="2.4" fill="var(--gold)"/></svg>';

var NAV=[
  ['home','الرئيسية',ICO.home,'all'],
  ['bookings','الحجوزات',ICO.bk,'all'],
  ['tickets','تذاكر الوكالات',ICO.tk,'all'],
  ['customers','العملاء',ICO.cu,'all'],
  ['pilgrims','المعتمرون والحجاج',ICO.pg,'all'],
  ['reminders','التذكيرات',ICO.bell,'all'],
  ['cash','الصندوق',ICO.cash,'all'],
  ['programs','العمرة والحج',ICO.cal,'all'],
  ['suppliers','الوكالات والموردون',ICO.sup,'admin'],
  ['reports','التقارير',ICO.rep,'admin'],
  ['audit','سجل التعديلات',ICO.aud,'admin'],
  ['settings','الإعدادات',ICO.set,'admin']
];

/* ---------- state ---------- */
var S={db:null,user:null,dl:null,admin:false,preview:false,readonly:false,uid:null,me:{name:'',avatarUrl:'',id:null},
  names:{},ready:{},settings:{},hasSettings:false,settingsLoaded:false,
  customers:[],suppliers:[],programs:[],bookings:[],txns:[],tickets:[],pilgrims:[],recurring:[],closings:[],reminders:[],audit:[],
  view:'home',sig:'',setupShown:false,rev:0,
  f:{rm:{kind:'all',st:'todo',lang:'auto'},pg:{q:'',pr:'all',st:'all'},au:{q:'',coll:'all'},tk:{q:'',ag:'all',due:false},bk:{q:'',status:'all',type:'all'},cu:{q:''},cb:{kind:'all',period:'month'},rp:{period:'month',from:'',to:''}}};
var IDX={cu:new Map(),su:new Map(),pr:new Map(),bk:new Map(),tk:new Map(),pg:new Map()};
var PAID={},CPAID={},SPAID={},CBILL={},SCOST={},PSEATS={},TPAID={},TREF={},SREF={},RFD={};
function isAdmin(){return S.admin&&!S.preview;}

/* ---------- helpers ---------- */
function nid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function num(v){
  if(v==null)return 0;
  var s=String(v).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d);}).replace(/٫/g,'.').replace(/[٬,\s]/g,'');
  var n=parseFloat(s);return isFinite(n)?n:0;
}
var NF=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
function mt(n){var v=Math.round((num(n)+Number.EPSILON)*100)/100;return NF.format(v)+(S.settings.currency?' '+S.settings.currency:'');}
function m(n){return '<bdi class="n">'+esc(mt(n))+'</bdi>';}
function compact(n){return new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayStr(){return iso(new Date());}
function addDays(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d);}
function fdate(s){
  if(!s)return '—';
  var p=String(s).split('-').map(Number);
  try{return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('ar-u-nu-latn',{day:'numeric',month:'short',year:'numeric'});}catch(e){return s;}
}
function monthLabel(k){var p=k.split('-').map(Number);try{return new Date(p[0],p[1]-1,1).toLocaleDateString('ar-u-nu-latn',{month:'short'});}catch(e){return k;}}
function inDays(s){
  var n=Math.round((new Date(s+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/864e5);
  if(n<=0)return 'اليوم';if(n===1)return 'غداً';if(n===2)return 'بعد يومين';if(n<=10)return 'بعد '+n+' أيام';return 'بعد '+n+' يوماً';
}
function periodRange(p){
  var n=new Date(),y=n.getFullYear(),mo=n.getMonth();
  if(p==='month')return [iso(new Date(y,mo,1)),iso(new Date(y,mo+1,0))];
  if(p==='last')return [iso(new Date(y,mo-1,1)),iso(new Date(y,mo,0))];
  if(p==='year')return [y+'-01-01',y+'-12-31'];
  if(p==='custom'){return [S.f.rp.from||'0000-01-01',S.f.rp.to||'9999-12-31'];}
  return ['0000-01-01','9999-12-31'];
}
function inR(d,a,b){d=d||'';return d>=a&&d<=b;}
function pill(t,c){return '<span class="pill '+(c||'')+'">'+esc(t)+'</span>';}
function stPill(s){var x=STATUS[s]||STATUS.pending;return pill(x[0],x[1]);}
function live(b){return b.status!=='cancelled';}
function empName(id){return !id?'—':(S.names[id]||'موظف');}
function custName(id){var c=IDX.cu.get(id);return c?c.name:'عميل محذوف';}
function opts(map,sel,first){
  var h=first?'<option value="">'+esc(first)+'</option>':'';
  Object.keys(map).forEach(function(k){var v=Array.isArray(map[k])?map[k][0]:map[k];h+='<option value="'+esc(k)+'"'+(k===sel?' selected':'')+'>'+esc(v)+'</option>';});
  return h;
}
function nextNo(arr){return arr.reduce(function(a,x){return Math.max(a,num(x.no));},1000)+1;}
function waLink(text){return 'https://wa.me/?text='+encodeURIComponent(text);}
function errMsg(e){
  if(e&&e.code==='quota_exceeded')return 'تم بلوغ حدّ التخزين المسموح به';
  if(e&&e.code==='invalid_argument')return 'لا تملك صلاحية تنفيذ هذا الإجراء';
  return (e&&e.message)||'حدث خطأ غير متوقع';
}
var toastT=0;
function toast(msg,kind){var t=$('#toast');t.textContent=msg;t.className='toast'+(kind==='bad'?' bad':'');t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},3200);}

/* ---------- derived numbers ---------- */
function reindex(){
  IDX.cu=new Map(S.customers.map(function(x){return [x.id,x];}));
  IDX.su=new Map(S.suppliers.map(function(x){return [x.id,x];}));
  IDX.pr=new Map(S.programs.map(function(x){return [x.id,x];}));
  IDX.bk=new Map(S.bookings.map(function(x){return [x.id,x];}));
  IDX.tk=new Map(S.tickets.map(function(x){return [x.id,x];}));
  IDX.pg=new Map(S.pilgrims.map(function(x){return [x.id,x];}));
  PAID={};CPAID={};SPAID={};CBILL={};SCOST={};PSEATS={};TPAID={};TREF={};SREF={};RFD={};
  S.txns.forEach(function(t){
    var a=num(t.amount);
    if(t.kind==='in'){
      if(t.bookingId)PAID[t.bookingId]=(PAID[t.bookingId]||0)+a;
      if(t.customerId)CPAID[t.customerId]=(CPAID[t.customerId]||0)+a;
    }else if(t.supplierId){
      SPAID[t.supplierId]=(SPAID[t.supplierId]||0)+a;
      if(t.ticketId)TPAID[t.ticketId]=(TPAID[t.ticketId]||0)+a;
    }
  });
  S.tickets.forEach(function(k){
    if(!k.supplierId)return;
    var a=tkNet(k);
    if(k.refund){SREF[k.supplierId]=(SREF[k.supplierId]||0)+a;if(k.refundOf){TREF[k.refundOf]=(TREF[k.refundOf]||0)+a;RFD[k.refundOf]=true;}}
    else SCOST[k.supplierId]=(SCOST[k.supplierId]||0)+a;
  });
  S.bookings.forEach(function(b){
    if(!live(b))return;
    if(b.customerId)CBILL[b.customerId]=(CBILL[b.customerId]||0)+num(b.price);
    if(b.supplierId)SCOST[b.supplierId]=(SCOST[b.supplierId]||0)+num(b.cost);
    if(b.programId)PSEATS[b.programId]=(PSEATS[b.programId]||0)+Math.max(1,num(b.pax));
  });
}
function custBal(id){return (CBILL[id]||0)-(CPAID[id]||0);}
function supBal(id){return (SCOST[id]||0)-(SREF[id]||0)-(SPAID[id]||0);}
function openingTotal(){
  var oa=S.settings.openingAcc;
  if(!oa)return num(S.settings.opening);
  return ACCTS.reduce(function(s,a){return s+num(oa[a]);},0);
}
function boxBalances(){
  var b={};ACCTS.forEach(function(a){b[a]=0;});
  var oa=S.settings.openingAcc;
  if(oa)ACCTS.forEach(function(a){b[a]+=num(oa[a]);});else b.cash+=num(S.settings.opening);
  S.txns.forEach(function(t){
    var a=num(t.amount);
    if(t.kind==='in')b[acctOf(t.method)]+=a;
    else if(t.kind==='out'){if(t.fromCash!==false)b[acctOf(t.method)]-=a;}
    else if(t.kind==='xfer'){b[acctOf(t.from)]-=a;b[acctOf(t.to)]+=a;}
    else if(t.kind==='adj'){b[acctOf(t.account)]+=a;}
  });
  return b;
}
function cashBalance(){var b=boxBalances();return ACCTS.reduce(function(s,a){return s+b[a];},0);}
function summary(from,to){

  S.bookings.forEach(function(b){
    if(!live(b)||!inR(b.date,from,to))return;
    var p=num(b.price),c=num(b.cost);
    r.sales+=p;r.cost+=c;r.count++;
    var t=r.byType[b.type||'other']||(r.byType[b.type||'other']={n:0,sales:0,cost:0});t.n++;t.sales+=p;t.cost+=c;
    var k=b.by||'—';var e=r.byEmp[k]||(r.byEmp[k]={n:0,sales:0,coll:0});e.n++;e.sales+=p;
  });
  S.txns.forEach(function(t){
    if(!inR(t.date,from,to))return;
    var a=num(t.amount);
    if(t.kind==='in'){
      r.collected+=a;
      var k=t.by||'—';var e=r.byEmp[k]||(r.byEmp[k]={n:0,sales:0,coll:0});e.coll+=a;
    }else if(t.kind==='adj'){r.adj+=a;
    }else if(t.kind==='out'&&!t.supplierId){
      r.expenses+=a;r.byCat[t.category||'other']=(r.byCat[t.category||'other']||0)+a;
    }
  });
  S.tickets.forEach(function(k){if(inR(k.date,from,to))r.commission+=num(k.commission);});
  r.profit=r.sales-r.cost;r.net=r.profit-r.expenses;
  return r;
}

function fieldHtml(f,v){

  else if(f.type==='tel'){inp='<input id="'+id+'" type="tel" dir="ltr" class="num" autocomplete="off" value="'+esc(val)+'" placeholder="'+esc(f.ph||'')+'">';}

function openForm(cfg){
  var api={
    dirty:cfg.dirty||{},
    has:function(k){return !!$('#f_'+k);},
    get:function(k){var el=$('#f_'+k);return el?el.value:'';},
    set:function(k,v){var el=$('#f_'+k);if(el)el.value=v;},
    setOptions:function(k,options,keep){
      var el=$('#f_'+k);if(!el)return;
      el.innerHTML=options.map(function(o){return '<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>';}).join('');

  };
  CUR={cfg:cfg,fields:cfg.fields,api:api,onChange:cfg.onChange,after:cfg.after,busy:false};

  var html='<form class="sheet" id="mform" novalidate><div class="sheet-h"><h2>'+esc(cfg.title)+'</h2>'+(cfg.noClose?'':'<button type="button" class="x" data-act="close" aria-label="إغلاق">×</button>')+'</div>'

function applyShowIf(){
  if(!CUR)return;
  CUR.fields.forEach(function(f){
    if(!f.showIf)return;
    var w=$('.fld[data-k="'+f.k+'"]');if(!w)return;
    var cur=CUR.api.get(f.showIf.k);
    w.hidden=!(f.showIf.in?f.showIf.in.indexOf(cur)>=0:cur===f.showIf.v);
  });
}
function collectForm(){
  var vals={};
  for(var i=0;i<CUR.fields.length;i++){
    var f=CUR.fields[i],w=$('.fld[data-k="'+f.k+'"]');
    if(!w||w.hidden)continue;
    var v=$('#f_'+f.k).value;
    if(f.type==='money'){
      var raw=v.trim();
      if(f.req&&!raw)return {err:f.label+' مطلوب'};
      v=num(raw);
      if(f.positive&&!(v>0))return {err:f.label+' يجب أن يكون أكبر من صفر'};
    }else{v=v.trim();if(f.req&&!v)return {err:f.label+' مطلوب'};}
    vals[f.k]=v;
  }
  return {vals:vals};
}
function hasDoc(id){
  return IDX.bk.has(id)||IDX.cu.has(id)||IDX.su.has(id)||IDX.pr.has(id)||IDX.tk.has(id)||IDX.pg.has(id)||S.closings.some(function(x){return x.id===id;})||S.recurring.some(function(x){return x.id===id;})||S.txns.some(function(x){return x.id===id;});
}
function afterSave(fn,res,rev0){
  var tries=0;
  (function go(){
    reindex();
    var ok=S.rev>rev0&&(typeof res!=='string'||hasDoc(res));
    if(ok||tries++>40)fn(res);else setTimeout(go,50);
  })();
}
function submitForm(){
  if(!CUR||CUR.busy)return;
  var r=collectForm(),er=$('#ferr');
  if(r.err){er.textContent=r.err;er.hidden=false;return;}
  er.hidden=true;CUR.busy=true;
  var btn=$('#fsave');btn.disabled=true;
  var cfg=CUR.cfg,after=CUR.after,rev0=S.rev;
  Promise.resolve().then(function(){return cfg.onSubmit(r.vals);}).then(function(res){
    closeModal();toast(cfg.done||'تم الحفظ');if(after)afterSave(after,res,rev0);
  },function(e){
    if(CUR){CUR.busy=false;btn.disabled=false;er.textContent=(e&&e.userMsg)||errMsg(e);er.hidden=false;}
  });
}

function chartSvg(keys,a,b){
  var W=600,H=232,pl=8,pr=46,pt=12,pb=28,iw=W-pl-pr,ih=H-pt-pb;
  var mx=Math.max.apply(null,[1].concat(a,b));
  var p=Math.pow(10,Math.floor(Math.log10(mx))),nn=mx/p,max=(nn<=1?1:nn<=2?2:nn<=5?5:10)*p;
  var gw=iw/keys.length,bw=Math.min(22,gw/3);
  var s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="مخطط المبيعات والمصاريف لآخر ستة أشهر">';
  [0,max/2,max].forEach(function(t){
    var y=pt+ih-(t/max)*ih;
    s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" class="gl"/><text x="'+(W-pr+6)+'" y="'+(y+4)+'" text-anchor="start" class="tx">'+compact(t)+'</text>';
  });
  keys.forEach(function(k,i){
    var cx=W-pr-gw*i-gw/2,h1=(a[i]/max)*ih,h2=(b[i]/max)*ih;
    s+='<rect x="'+(cx-bw-1)+'" y="'+(pt+ih-h1)+'" width="'+bw+'" height="'+Math.max(h1,0)+'" rx="2" class="b1" fill="var(--brand)"/>'
      +'<rect x="'+(cx+1)+'" y="'+(pt+ih-h2)+'" width="'+bw+'" height="'+Math.max(h2,0)+'" rx="2" class="b2" fill="var(--gold)"/>'
      +'<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" class="tx">'+esc(monthLabel(k))+'</text>';
  });
  return s+'</svg>';
}

      {k:'note',label:'ملاحظات',type:'textarea',full:true}
    ],

        var cid=api.get('customerId');

        var o=[['','دفعة على الحساب']].concat(bks.map(function(b){return [b.id,'#'+b.no+' — '+(b.title||TYPES[b.type])+' — متبقي '+mt(num(b.price)-(PAID[b.id]||0))];}));
        api.setOptions('bookingId',o,k===null?keepB:'');
        if(k===null&&keepB){var bb=IDX.bk.get(keepB);if(bb&&!api.get('amount'))api.set('amount',Math.max(0,num(bb.price)-(PAID[keepB]||0)));}
      }
      if(k==='bookingId'){
        var b=IDX.bk.get(api.get('bookingId'));
        if(b&&!api.dirty.amount)api.set('amount',Math.max(0,num(b.price)-(PAID[b.id]||0)));

    },
    after:function(id){openReceiptDoc(id);}
  });
}

function txnDesc(t){
  if(t.kind==='adj')return 'تسوية جرد'+(t.note&&t.note.indexOf('تسوية جرد — ')===0?' — '+t.note.slice(12):'');
  if(t.kind==='xfer')return 'تحويل من «'+(METHODS[acctOf(t.from)]||'')+'» إلى «'+(METHODS[acctOf(t.to)]||'')+'»';
  if(t.kind==='in'){var b=t.bookingId?IDX.bk.get(t.bookingId):null;return custName(t.customerId)+(b?' — حجز #'+b.no:'');}
  if(t.ticketId){var tk=IDX.tk.get(t.ticketId),ag=IDX.su.get(t.supplierId);return 'دفعة لوكالة: '+(ag?ag.name:'محذوفة')+(tk?' — تذكرة '+(tk.passenger||''):'');}
  if(t.supplierId){var s=IDX.su.get(t.supplierId);return 'دفعة لمورد: '+(s?s.name:'محذوف');}
  return EXP_CATS[t.category]||'مصروف';
}
function openTxn(id){
  var t=S.txns.find(function(x){return x.id===id;});if(!t)return;
  var inn=t.kind==='in',xf=t.kind==='xfer',adj=t.kind==='adj';
  var body='<dl class="kvs">'+kv('النوع',inn?pill('سند قبض','good'):(xf?pill('تحويل','info'):(adj?pill('تسوية جرد','warn'):pill('سند صرف','bad'))))+kv('التاريخ',esc(fdate(t.date)))+kv('المبلغ',m(t.amount))
    +(adj?kv('الحساب',esc(METHODS[acctOf(t.account)]||''))+kv('البيان',esc(txnDesc(t)),true):xf?kv('من حساب',esc(METHODS[acctOf(t.from)]||''))+kv('إلى حساب',esc(METHODS[acctOf(t.to)]||''))
        :kv(inn?'الحساب (طريقة القبض)':'طريقة الدفع',esc(METHODS[t.method]||''))
          +(t.kind==='out'?kv('الصندوق',t.fromCash===false?'لم يُخصم من الصندوق':'خُصم من رصيد «'+(METHODS[acctOf(t.method)]||'')+'»'):'')
          +kv('البيان',esc(txnDesc(t)),true))
    +(t.note?kv('ملاحظات',esc(t.note),true):'')+kv('سجّله',esc(empName(t.by)))+'</dl>';
  var text=(S.settings.agency||'')+'\nسند قبض رقم '+t.no+'\nالتاريخ: '+fdate(t.date)+'\nاستلمنا من: '+custName(t.customerId)+'\nالمبلغ: '+mt(t.amount)+'\nالبيان: '+txnDesc(t);
  showDetail((inn?'سند قبض':(xf?'تحويل':(adj?'تسوية':'سند صرف')))+' <bdi class="n">#'+esc(t.no)+'</bdi>',body,
    (inn?'<button class="btn pri" data-act="rcpt-tx" data-id="'+id+'">سند للطباعة</button><a class="btn" target="_blank" rel="noopener" href="'+esc(waTo((IDX.cu.get(t.customerId)||{}).phone,text))+'">واتساب</a>':'')
    +(isAdmin()?'<span class="sp"></span><button class="btn danger wr" data-act="del-tx" data-id="'+id+'">حذف</button>':''));
}

/* cashbox */
function listTxns(){
  var f=S.f.cb,adm=isAdmin(),r=periodRange(f.period);
  var a=S.txns.filter(function(t){
    if(!inR(t.date,r[0],r[1]))return false;
    if(t.kind==='out'&&t.fromCash===false)return false;
    return adm?(f.kind==='all'||t.kind===f.kind):t.kind==='in';
  }).sort(function(x,y){return (y.date||'').localeCompare(x.date||'')||num(y.no)-num(x.no);});
  if(!a.length)return emptyBox('لا توجد حركات في هذه الفترة');
  var ti=0,to=0;
  var rows=a.slice(0,400).map(function(t){
    var amt=num(t.amount),xf=t.kind==='xfer';
    var adj=t.kind==='adj',inc=t.kind==='in'||(adj&&amt>0),outc=t.kind==='out'||(adj&&amt<0);if(inc)ti+=Math.abs(amt);else if(outc)to+=Math.abs(amt);
    return '<tr data-act="tx" data-id="'+t.id+'"><td class="main" data-l="التاريخ">'+esc(fdate(t.date))+'<small>#'+esc(t.no)+'</small></td>'
      +'<td data-l="البيان">'+esc(txnDesc(t))+(xf?'<small>'+m(amt)+'</small>':(t.note?'<small>'+esc(t.note)+'</small>':''))+'</td>'
      +'<td data-l="الحساب">'+(xf?'—':esc(METHODS[acctOf(adj?t.account:t.method)]||''))+'</td>'
      +'<td data-l="وارد">'+(inc?'<span class="pos">'+m(Math.abs(amt))+'</span>':'—')+'</td>'
      +(adm?'<td data-l="صادر">'+(outc?'<span class="neg">'+m(Math.abs(amt))+'</span>':'—')+'</td>':'')
      +'<td data-l="الموظف">'+esc(empName(t.by))+'</td></tr>';
  }).join('');
  return '<div class="card flush"><div class="tw"><table class="tbl"><thead><tr><th>التاريخ</th><th>البيان</th><th>الحساب</th><th>وارد</th>'+(adm?'<th>صادر</th>':'')+'<th>الموظف</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div class="foot"><span>الوارد: <b>'+m(ti)+'</b></span>'+(adm?'<span>الصادر: <b>'+m(to)+'</b></span><span>الصافي: <b>'+m(ti-to)+'</b></span>':'')+'</div></div>';
}

function acctPill(b){

  if(b<-0.005)return pill('مدينة','info')+' <b>'+m(-b)+'</b>';
  return pill('متوازن','good');

function acctStatement(entries){
  var run=0;
  return '<div class="tw"><table class="tbl"><thead><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead><tbody>'
    +entries.map(function(e){
      run+=e.cr-e.dr;
      var side=run>0.005?'<small>دائنة</small>':(run<-0.005?'<small>مدينة</small>':'');
      return '<tr><td class="main" data-l="التاريخ">'+esc(fdate(e.date))+'</td><td data-l="البيان">'+esc(e.text)+'</td><td data-l="مدين">'+(e.dr?m(e.dr):'—')+'</td><td data-l="دائن">'+(e.cr?m(e.cr):'—')+'</td><td data-l="الرصيد">'+m(Math.abs(run))+side+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}
function openSupplier(id){
  var s=IDX.su.get(id);if(!s)return;
  var ent=[];
  S.bookings.forEach(function(b){if(b.supplierId===id&&live(b)&&num(b.cost))ent.push({date:b.date,t:num(b.createdAt),text:'حجز #'+b.no+' — '+custName(b.customerId),cr:num(b.cost),dr:0});});
  S.tickets.forEach(function(k){
    if(k.supplierId!==id)return;
    var who=(k.passenger||'')+(k.ticketNo?' ('+k.ticketNo+')':'');
    if(k.refund){ent.push({date:k.date,t:num(k.createdAt),text:'استرجاع تذكرة '+who+(num(k.penalty)?' (بعد خصم '+mt(k.penalty)+')':''),cr:0,dr:tkNet(k)});}
    else{
      ent.push({date:k.date,t:num(k.createdAt),text:'تذكرة '+who+' — السعر',cr:num(k.fare),dr:0});
      if(num(k.commission))ent.push({date:k.date,t:num(k.createdAt)+1,text:'عمولة تذكرة '+(k.passenger||''),cr:num(k.commission),dr:0});
    }
  });
  S.txns.forEach(function(t){if(t.kind==='out'&&t.supplierId===id){
    var tk=t.ticketId?IDX.tk.get(t.ticketId):null;
    ent.push({date:t.date,t:num(t.createdAt),text:(t.method==='discount'?'خصم':'دفعة')+' #'+t.no+' — '+(METHODS[t.method]||'')+(tk?' — تذكرة '+(tk.passenger||''):''),cr:0,dr:num(t.amount)});
  }});
  ent.sort(function(a,b){return (a.date||'').localeCompare(b.date||'')||a.t-b.t;});
  var cr=SCOST[id]||0,pd=SPAID[id]||0,rf=SREF[id]||0,bal=supBal(id);
  var body='<dl class="kvs">'+kv('النوع',esc(SUP_TYPES[s.type]||''))+kv('الهاتف',s.phone?'<bdi class="n">'+esc(s.phone)+'</bdi>':'')
    +kv('إجمالي الدائن (تذاكر + عمولات)',m(cr))+kv('المدفوع والخصومات',m(pd))
    +(rf?kv('التذاكر المسترجعة',m(rf)):'')
    +kv('الرصيد',acctPill(bal),true)+(s.note?kv('ملاحظات',esc(s.note),true):'')+'</dl>'
    +'<p style="color:var(--muted);margin-bottom:6px">دائنة: علينا مبلغ لها · مدينة: لنا مبلغ عندها</p>'
    +'<h4>كشف الحساب</h4>'+(ent.length?acctStatement(ent):'<p style="color:var(--muted)">لا توجد حركات بعد.</p>');
  showDetail(esc(s.name),body,
    '<button class="btn pri wr" data-act="pay-su" data-id="'+id+'">تسديد دفعة</button><button class="btn wr" data-act="new-tk-su" data-id="'+id+'">تذكرة جديدة</button><button class="btn wr" data-act="edit-su" data-id="'+id+'">تعديل</button>');
}

/* tickets issued through partner agencies (price + commission owed to the agency; refunds reduce it) */
function tkNet(k){return num(k.fare)+num(k.commission);}
function tkRem(k){return tkNet(k)-(TREF[k.id]||0)-(TPAID[k.id]||0);}
function listTickets(){
  var f=S.f.tk,q=f.q.trim().toLowerCase(),adm=isAdmin();
  var a=S.tickets.filter(function(k){
    if(f.ag!=='all'&&k.supplierId!==f.ag)return false;
    if(adm&&f.due&&(k.refund||tkRem(k)<=0.005))return false;
    return !q||[k.passenger,k.pnr,k.ticketNo,k.airline,k.route].join(' ').toLowerCase().indexOf(q)>=0;
  }).sort(function(x,y){return (y.date||'').localeCompare(x.date||'')||num(y.createdAt)-num(x.createdAt);});
  if(!a.length)return emptyBox(S.tickets.length?'لا نتائج مطابقة':'لا توجد تذاكر مسجّلة بعد',S.tickets.length?'':'اضغط «تذكرة جديدة» لتسجيل أول تذكرة.');
  var tf=0,tc=0,tp=0,tr=0;

/* ---------- amount in words (Arabic / French) ---------- */
var AR_ONES_M=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
var AR_ONES_F=['','واحدة','اثنتان','ثلاث','أربع','خمس','ست','سبع','ثمان','تسع','عشر','إحدى عشرة','اثنتا عشرة','ثلاث عشرة','أربع عشرة','خمس عشرة','ست عشرة','سبع عشرة','ثماني عشرة','تسع عشرة'];
var AR_TENS=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
var AR_HUND=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
var AR_SCALES=[null,{s:'ألف',d:'ألفان',dc:'ألفا',p:'آلاف',t:'ألفاً'},{s:'مليون',d:'مليونان',dc:'مليونا',p:'ملايين',t:'مليوناً'},{s:'مليار',d:'ملياران',dc:'مليارا',p:'مليارات',t:'ملياراً'}];
function arBelow100(r,fem){
  if(r<20)return (fem?AR_ONES_F:AR_ONES_M)[r];
  var o=r%10,t=Math.floor(r/10);
  return o?(((fem&&o===1)?'إحدى':(fem?AR_ONES_F:AR_ONES_M)[o])+' و'+AR_TENS[t]):AR_TENS[t];
}
function arHundreds(h,construct){return (construct&&h===2)?'مائتا':AR_HUND[h];}
function arScale(g,sc){
  var h=Math.floor(g/100),r=g%100,pre=h?arHundreds(h,r===0)+(r?' و':' '):'';
  if(h&&(r===1||r===2))return arHundreds(h,false)+' '+sc.s+' و'+(r===1?sc.s:sc.d);
  if(r===0)return (h===0?'':pre)+sc.s;
  if(r===1)return pre+sc.s;
  if(r===2)return pre+sc.d;
  if(r<=10)return pre+AR_ONES_M[r]+' '+sc.p;
  return pre+arBelow100(r,false)+' '+sc.t;
}
/* noun = {o:'ريال',d:'ريالان',p:'ريالات',t:'ريالاً',f:false} */
function arInt(n,noun){
  n=Math.floor(n);
  if(n===0)return 'صفر '+noun.o;
  var groups=[],x=n;
  while(x>0){groups.push(x%1000);x=Math.floor(x/1000);}
  var parts=[],lastI=0;
  for(var j=1;j<groups.length;j++){if(groups[j]){lastI=j;break;}}
  for(var i=groups.length-1;i>=1;i--){
    var g=groups[i];if(!g)continue;
    var sc=AR_SCALES[i];if(!sc)continue;
    if(groups[0]===0&&i===lastI)sc={s:sc.s,d:sc.dc,p:sc.p,t:sc.s};
    if(g===1)parts.push(sc.s);else if(g===2)parts.push(sc.d);else parts.push(arScale(g,sc));
  }
  var u=groups[0],tail;
  if(u===0)tail=noun.o;
  else{
    var h=Math.floor(u/100),r=u%100,pre=h?arHundreds(h,r===0)+(r?' و':' '):'';
    if(r===0)tail=pre+noun.o;
    else if(r===1)tail=pre+noun.o+' '+(noun.f?'واحدة':'واحد');
    else if(r===2)tail=pre+noun.d;
    else if(r<=10)tail=pre+(noun.f?AR_ONES_F:AR_ONES_M)[r]+' '+noun.p;
    else tail=pre+arBelow100(r,noun.f)+' '+noun.t;
  }
  if(parts.length&&u===0)return parts.join(' و')+' '+noun.o;
  return (parts.length?parts.join(' و')+' و':'')+tail;
}

function amountWordsAr(amount,cur){

var FR_U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];
var FR_T=['','','vingt','trente','quarante','cinquante','soixante'];
function fr100(n){
  if(n<17)return FR_U[n];
  if(n<20)return 'dix-'+FR_U[n-10];
  if(n<70){
    var t=Math.floor(n/10),u=n%10;
    return FR_T[t]+(u===1?' et un':(u?'-'+FR_U[u]:''));
  }
  if(n<80){var r=n-60;return 'soixante'+(r===11?' et onze':'-'+fr100(r));}
  if(n===80)return 'quatre-vingts';
  if(n<100)return 'quatre-vingt-'+fr100(n-80);
  return '';
}
function fr1000(n,final){
  var h=Math.floor(n/100),r=n%100,s='';
  if(h===1)s='cent';else if(h>1)s=FR_U[h]+' cent'+((r===0&&final)?'s':'');
  if(r){var t=fr100(r);if(r===80&&!final)t='quatre-vingt';s+=(s?' ':'')+t;}
  return s;
}
function frInt(n){
  n=Math.floor(n);
  if(n===0)return 'zéro';
  var parts=[],b=Math.floor(n/1e9),m=Math.floor(n%1e9/1e6),k=Math.floor(n%1e6/1000),u=n%1000;
  if(b)parts.push(fr1000(b,true)+' milliard'+(b>1?'s':''));
  if(m)parts.push(fr1000(m,true)+' million'+(m>1?'s':''));
  if(k)parts.push(k===1?'mille':fr1000(k,false)+' mille');
  if(u)parts.push(fr1000(u,true));
  return parts.join(' ');
}

var VISA={none:['لم تُقدَّم',''],sub:['قيد الدراسة','warn'],ok:['صدرت','good'],rej:['مرفوضة','bad']};
var PG_DOCS=[['passport','نسخة الجواز'],['photo','صور شخصية'],['vacc','شهادة التطعيم'],['visa','التأشيرة'],['ticket','تذكرة الطيران'],['contract','العقد الموقّع'],['mahram','وثيقة المحرم']];
var ROOMS={single:'فردية',double:'ثنائية',triple:'ثلاثية',quad:'رباعية'};
var PG_ST={active:['نشط','info'],gone:['سافر','good'],cancel:['ملغى','']};
function pgDocList(p){return PG_DOCS.filter(function(d){return d[0]!=='mahram'||p.gender==='f';});}
function pgDocs(p){
  var l=pgDocList(p),dn=p.docs||{},done=l.filter(function(d){return dn[d[0]];});
  return {done:done.length,total:l.length,missing:l.filter(function(d){return !dn[d[0]];}).map(function(d){return d[1];})};
}
function pgDep(p){var pr=IDX.pr.get(p.programId);return p.flightDate||(pr&&pr.dep)||'';}
function pgWarn(p){
  var t=todayStr(),ref=pgDep(p);
  if(!p.passport)return pill('لا رقم جواز','warn');
  if(!p.passportExp)return '';
  if(p.passportExp<t)return pill('جواز منتهٍ','bad');
  if(ref&&ref>=t&&p.passportExp<addDays(ref,180))return pill('لا يغطي 6 أشهر بعد السفر','bad');
  if(p.passportExp<addDays(t,180))return pill('الجواز ينتهي قريباً','warn');
  return '';
}
function pgVisa(p){var v=VISA[p.visaStatus||'none']||VISA.none;return pill(v[0],v[1]);}
function listPilgrims(){
  var f=S.f.pg,q=f.q.trim().toLowerCase();
  var a=S.pilgrims.filter(function(p){
    if(q&&[p.name,p.nameLatin,p.passport,p.phone,p.group].join(' ').toLowerCase().indexOf(q)<0)return false;
    if(f.pr!=='all'&&p.programId!==f.pr)return false;
    if(f.st==='docs'&&(p.state==='cancel'||pgDocs(p).missing.length===0))return false;
    if(f.st==='visa'&&(p.state==='cancel'||p.visaStatus==='ok'))return false;
    if(f.st==='pass'&&(p.state==='cancel'||!pgWarn(p)))return false;
    return true;
  }).sort(function(x,y){return (pgDep(x)||'9').localeCompare(pgDep(y)||'9')||(x.name||'').localeCompare(y.name||'','ar');});
  if(!a.length)return emptyBox(S.pilgrims.length?'لا نتائج مطابقة':'لا توجد ملفات بعد','اضغط «ملف جديد» لإضافة أول معتمر أو حاج.');
  return '<div class="card flush"><div class="tw"><table class="tbl"><thead><tr><th>الاسم</th><th>البرنامج / السفر</th><th>التأشيرة</th><th>الوثائق</th><th>الهاتف</th></tr></thead><tbody>'
    +a.slice(0,400).map(function(p){
      var d=pgDocs(p),pr=IDX.pr.get(p.programId),dep=pgDep(p);
      var w=pgWarn(p),st=p.state&&p.state!=='active'?pill(PG_ST[p.state][0],PG_ST[p.state][1]):'';
      return '<tr data-act="pg" data-id="'+p.id+'"><td class="main" data-l="الاسم">'+esc(p.name)+((w||st||p.group)?'<small>'+(p.group?esc(p.group)+' ':'')+st+' '+w+'</small>':'')+'</td>'
        +'<td data-l="البرنامج">'+(pr?esc(pr.name):'—')+(dep?'<small>'+esc(fdate(dep))+'</small>':'')+'</td>'
        +'<td data-l="التأشيرة">'+pgVisa(p)+'</td>'
        +'<td data-l="الوثائق">'+(d.missing.length?'<span class="neg">'+d.done+' / '+d.total+'</span>':pill('مكتملة','good'))+'</td>'
        +'<td data-l="الهاتف">'+(p.phone?'<bdi class="n">'+esc(p.phone)+'</bdi>':'—')+'</td></tr>';
    }).join('')+'</tbody></table></div><div class="foot"><span>عدد الملفات: <b>'+a.length+'</b></span></div></div>';
}

function logAudit(action,coll,id,old,data){
  if(!S.db||!COLL_LBL[coll])return;
  try{
    var ch=[];
    if(action==='update'&&old&&data){
      Object.keys(data).forEach(function(k){
        if(AUD_SKIP[k])return;
        var a=old[k],b=data[k];

/* ---------- recurring expenses ---------- */
function nextYm(k){var p=k.split('-').map(Number),d=new Date(p[0],p[1],1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function prevYm(k){var p=k.split('-').map(Number),d=new Date(p[0],p[1]-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function ymDue(r,k){var p=k.split('-').map(Number),last=new Date(p[0],p[1],0).getDate();return k+'-'+String(Math.min(Math.max(1,num(r.day)||1),last)).padStart(2,'0');}
function runRecurring(){
  if(!isAdmin()||S.readonly||S.recRan||!S.ready.recurring||!S.ready.txns)return;
  S.recRan=true;
  var t=todayStr(),cur=t.slice(0,7),jobs=[],lasts=[];
  S.recurring.forEach(function(r){
    if(r.active===false)return;
    var k=nextYm(r.lastMonth||prevYm(cur)),last=null,n=0;
    while(k<=cur&&n<24){var due=ymDue(r,k);if(due>t)break;jobs.push({r:r,k:k,due:due});last=k;k=nextYm(k);n++;}
    if(last)lasts.push({r:r,last:last});
  });
  if(!jobs.length)return;
  var base=nextNo(S.txns);
  Promise.all(jobs.map(function(j,i){
    return setDoc('txns','rc_'+j.r.id+'_'+j.k,{kind:'out',no:base+i,amount:num(j.r.amount),method:j.r.method||'cash',date:j.due,category:j.r.category||'other',fromCash:true,note:'مصروف دوري — '+(j.r.name||''),recurringId:j.r.id,by:S.uid,createdAt:Date.now()});
  })).then(function(){
    return Promise.all(lasts.map(function(x){return setDoc('recurring',x.r.id,Object.assign({},stripId(x.r),{lastMonth:x.last}));}));
  }).then(function(){toast('سُجّل '+jobs.length+' مصروف دوري تلقائياً');},function(e){S.recRan=false;toast(errMsg(e),'bad');});
}

    return '<button class="row" data-act="edit-rec" data-id="'+r.id+'"><span class="r1"><b>'+esc(r.name)+'</b><small>'+esc(EXP_CATS[r.category]||'')+' · يوم '+esc(r.day)+' من كل شهر · '+esc(METHODS[r.method]||'')+'</small></span><span class="r2">'+(r.active===false?pill('موقوف'):m(r.amount))+'</span></button>';

var BK_COLLS=['customers','suppliers','programs','bookings','txns','tickets','pilgrims','recurring','closings'];
function backupData(){
  var data={};BK_COLLS.forEach(function(c){data[c]=(S[c]||[]).map(function(d){if(c!=='pilgrims'||!d.files)return d;var o=Object.assign({},d);delete o.files;return o;});});

function saveBackup(){
  if(!isAdmin())return;

  S.dl.save({filename:'rehlati-backup-'+todayStr()+'.json',data:JSON.stringify(backupData())}).then(function(){
    toast('تم حفظ النسخة الاحتياطية');
    return setDoc('settings','main',Object.assign({},S.settings,{lastBackup:Date.now()}));
  },function(e){if(!e||e.code!=='declined')toast('تعذّر تنزيل الملف','bad');});
}
function shareBackup(){
  if(!isAdmin())return;
  var name='rehlati-backup-'+todayStr()+'.json',blob=new Blob([JSON.stringify(backupData())],{type:'application/json'});
  function mark(){toast('تمت العملية. تأكد من وصول الملف إلى بريدك أو درايف.');return setDoc('settings','main',Object.assign({},S.settings,{lastBackup:Date.now()}));}
  var f=null;try{f=new File([blob],name,{type:'application/json'});}catch(e){}
  var ok=false;try{ok=!!(f&&navigator.canShare&&navigator.share&&navigator.canShare({files:[f]}));}catch(e){}
  function save(){
    if(!S.dl){toast('تنزيل الملفات غير متاح هنا','bad');return;}
    S.dl.save({filename:name,data:blob}).then(function(){toast('تم حفظ الملف. أرفقه الآن في بريد جديد أو ارفعه إلى درايف.');return setDoc('settings','main',Object.assign({},S.settings,{lastBackup:Date.now()}));},function(e){if(!e||e.code!=='declined')toast('تعذّر تنزيل الملف','bad');});
  }
  if(!ok){save();return;}
  navigator.share({files:[f],title:'نسخة احتياطية — '+(S.settings.agency||'')}).then(mark,function(e){if(e&&e.name==='AbortError')return;save();});
}
function parseBackup(text){
  var o;try{o=JSON.parse(text);}catch(e){throw userErr('الملف ليس نسخة احتياطية صالحة.');}
  if(!o||o.app!=='rehlati'||!o.data||typeof o.data!=='object')throw userErr('هذا الملف ليس نسخة احتياطية من هذا التطبيق.');
  var jobs=[],counts={};
  BK_COLLS.forEach(function(c){
    var arr=o.data[c];if(arr==null)return;
    if(!Array.isArray(arr))throw userErr('بنية النسخة غير صالحة ('+c+').');
    arr.forEach(function(d){
      if(!d||typeof d!=='object'||Array.isArray(d)||typeof d.id!=='string'||!/^[A-Za-z0-9_\-]{1,80}$/.test(d.id))throw userErr('النسخة تحتوي سجلاً تالفاً في «'+c+'».');
      var dd=stripId(d);if(c==='pilgrims'){delete dd.files;var cu=IDX.pg.get(d.id);if(cu&&cu.files)dd.files=cu.files;}
      jobs.push({coll:c,id:d.id,data:dd});
    });
    counts[c]=arr.length;
  });
  if(o.settings&&typeof o.settings==='object'&&!Array.isArray(o.settings))jobs.push({coll:'settings',id:'main',data:o.settings});
  if(!jobs.length)throw userErr('النسخة فارغة.');
  return {at:o.at,agency:o.agency,jobs:jobs,counts:counts};
}

function doRestore(btn){

  });

/* ---------- PDF (generated in the browser) ---------- */
var PDF_PX=794;
function u8cat(arr){var n=0,i;for(i=0;i<arr.length;i++)n+=arr[i].length;var o=new Uint8Array(n),p=0;for(i=0;i<arr.length;i++){o.set(arr[i],p);p+=arr[i].length;}return o;}
function strU8(s){var o=new Uint8Array(s.length);for(var i=0;i<s.length;i++)o[i]=s.charCodeAt(i)&255;return o;}
function dataUrlU8(u){var b=atob(u.slice(u.indexOf(',')+1)),o=new Uint8Array(b.length);for(var i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o;}
function pad10(n){var s=String(n);while(s.length<10)s='0'+s;return s;}
function buildPdf(pages){
  var PW=595.28,PH=841.89,M=28,parts=[],offs={},len=0,n=pages.length,i;
  function push(u){parts.push(u);len+=u.length;}
  function obj(id,body){offs[id]=len;push(strU8(id+' 0 obj\n'));push(typeof body==='string'?strU8(body):body);push(strU8('\nendobj\n'));}
  push(strU8('%PDF-1.4\n%âãÏÓ\n'));
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  var kids=[];for(i=0;i<n;i++)kids.push((3+3*i)+' 0 R');
  obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>');
  pages.forEach(function(p,i){
    var pw=PW-2*M,ph=pw*p.h/p.w,y=PH-M-ph;
    var cs='q '+pw.toFixed(2)+' 0 0 '+ph.toFixed(2)+' '+M+' '+y.toFixed(2)+' cm /Im0 Do Q';
    obj(3+3*i,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im0 '+(5+3*i)+' 0 R >> >> /Contents '+(4+3*i)+' 0 R >>');
    obj(4+3*i,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
    var head=strU8('<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.jpg.length+' >>\nstream\n');
    obj(5+3*i,u8cat([head,p.jpg,strU8('\nendstream')]));
  });
  var total=3+3*n,xo=len,x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(i=1;i<total;i++)x+=pad10(offs[i])+' 00000 n \n';
  x+='trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF\n';

function canvasToPages(canvas){
  var W=canvas.width,H=canvas.height,PW=595.28,PH=841.89,M=28;
  var slice=Math.floor((PH-2*M)/(PW-2*M)*W),pages=[],y=0;
  while(y<H){
    var sh=Math.min(slice,H-y),t=document.createElement('canvas');t.width=W;t.height=sh;
    var cx=t.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,W,sh);cx.drawImage(canvas,0,y,W,sh,0,0,W,sh);
    pages.push({jpg:dataUrlU8(t.toDataURL('image/jpeg',0.92)),w:W,h:sh});
    y+=sh;
  }
  return pages;
}
function makePdf(info){
  if(!window.htmlToImage)return Promise.reject(new Error('no-lib'));

  host.setAttribute('aria-hidden','true');

  var art=document.createElement('article');

  art.innerHTML=info.inner;
  art.style.cssText='width:'+PDF_PX+'px;max-width:none;padding:38px 44px;margin:0;border-radius:0;box-shadow:none;background:#fff';
  host.appendChild(art);document.body.appendChild(host);
  function clean(){try{document.body.removeChild(host);}catch(e){}}
  var fonts=(document.fonts&&document.fonts.ready)?document.fonts.ready.catch(function(){}):Promise.resolve();

}

var ATT_KINDS=[['passport','الجواز'],['visa','التأشيرة'],['ticket','التذكرة'],['photo','صورة شخصية'],['other','أخرى']];
var ATT_DOC={passport:'passport',visa:'visa',ticket:'ticket',photo:'photo'};
var ATT_CHUNK=180000,ATT_MAX_IMG=480000,ATT_MAX_PDF=1000000,ATT_MAX_FILES=12;
function attKindLbl(k){var a=ATT_KINDS.filter(function(x){return x[0]===k;})[0];return a?a[1]:'مرفق';}
function fmtSize(n){n=num(n);return n>=1048576?(Math.round(n/104857.6)/10)+' م.ب':Math.max(1,Math.round(n/1024))+' ك.ب';}
function fileToImage(file){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){URL.revokeObjectURL(u);res(im);};
    im.onerror=function(){URL.revokeObjectURL(u);rej(userErr('تعذّرت قراءة الصورة. جرّب صورة JPG أو PNG.'));};
    im.src=u;
  });
}
function compressImage(file){
  return fileToImage(file).then(function(im){
    var w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;
    if(!w||!h)throw userErr('تعذّرت قراءة الصورة.');
    var steps=[[1400,0.78],[1200,0.68],[1000,0.58],[800,0.5],[640,0.45]],out=null;
    for(var i=0;i<steps.length;i++){
      var sc=Math.min(1,steps[i][0]/Math.max(w,h)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
      var cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(im,0,0,c.width,c.height);
      var u=c.toDataURL('image/jpeg',steps[i][1]),sz=Math.floor((u.length-u.indexOf(',')-1)*0.75);
      out={dataUrl:u,type:'image/jpeg',size:sz};
      if(sz<=ATT_MAX_IMG)break;
    }
    if(out.size>ATT_MAX_IMG*1.5)throw userErr('الصورة كبيرة جداً حتى بعد الضغط.');
    return out;
  });
}
function readAsDataUrl(file){
  return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result||''));};r.onerror=function(){rej(userErr('تعذّرت قراءة الملف.'));};r.readAsDataURL(file);});
}
function prepareAttachment(file){
  var isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name||'');
  var isImg=/^image\//.test(file.type||'')||/\.(jpe?g|png|webp|gif|bmp)$/i.test(file.name||'');
  if(isPdf){
    if(file.size>ATT_MAX_PDF)return Promise.reject(userErr('ملف PDF أكبر من 1 م.ب. صوّر الصفحة كصورة أو قلّل حجم الملف.'));
    return readAsDataUrl(file).then(function(u){return {dataUrl:'data:application/pdf;base64,'+u.slice(u.indexOf(',')+1),type:'application/pdf',size:file.size};});
  }
  if(isImg)return compressImage(file);
  return Promise.reject(userErr('نوع الملف غير مدعوم. استخدم صورة أو ملف PDF.'));
}
function saveAttachment(pid,kind,file){

  return prepareAttachment(file).then(function(a){
    var b64=a.dataUrl.slice(a.dataUrl.indexOf(',')+1),n=Math.max(1,Math.ceil(b64.length/ATT_CHUNK)),fid=nid(),jobs=[];
    for(var i=0;i<n;i++)jobs.push(S.db.collection('pgfiles').doc(fid+'_'+i).set({d:b64.slice(i*ATT_CHUNK,(i+1)*ATT_CHUNK),i:i,p:pid}));

/* ---------- Google Drive backup (through the admin's Drive connector) ---------- */
var DRIVE='Google Drive',DRIVE_FOLDER='نسخ رحلتي الاحتياطية',driveBusy=false;
function driveErr(e){
  var c=e&&e.code;
  if(e&&e.userMsg)return e.userMsg;
  if(c==='server_not_connected'||c==='server_not_found')return 'جوجل درايف غير مربوط بحسابك. اربطه من إعدادات Claude ← الموصّلات ثم أعد المحاولة.';
  if(c==='needs_reauth')return 'انتهت صلاحية ربط جوجل درايف. أعد ربطه من إعدادات Claude ← الموصّلات.';
  if(c==='selection_required')return 'لديك أكثر من حساب درايف مربوط. اختر واحداً عند ظهور رسالة الاختيار ثم أعد المحاولة.';
  if(c==='not_in_manifest'||c==='consent_required'||c==='not_granted'||c==='capability_disabled')return 'لم يُسمح للصفحة بالوصول إلى جوجل درايف. اسمح بذلك من قائمة أذونات الصفحة ثم أعد المحاولة.';
  if(c==='blocked_by_policy'||c==='approval_required')return 'سياسة منظمتك تمنع هذه العملية على درايف.';
  if(c==='server_unavailable'||c==='upstream_error')return 'تعذّر الوصول إلى جوجل درايف الآن. حاول بعد قليل.';
  if(c==='tool_error')return 'رفض درايف العملية: '+String((e&&e.message)||'').slice(0,120);
  return 'تعذّر الحفظ في جوجل درايف.';
}
function driveFolder(mcp){
  var q="title = '"+DRIVE_FOLDER+"' and mimeType = 'application/vnd.google-apps.folder' and owner = 'me'";
  return mcp.callTool(DRIVE,'search_files',{query:q,pageSize:5,excludeContentSnippets:true}).then(function(r){
    var p=r&&r.payload,files=(p&&p.files)||[];
    if(files.length&&files[0].id)return files[0].id;
    return mcp.callTool(DRIVE,'create_file',{title:DRIVE_FOLDER,mimeType:'application/vnd.google-apps.folder'}).then(function(r2){
      var f=r2&&r2.payload;if(!f||!f.id)throw {code:'upstream_error'};return f.id;
    });
  });
}
function driveUpload(mcp,folderId,name,json){
  return mcp.listTools().then(function(l){return !!(l&&l.fileArgs);},function(){return false;}).then(function(fa){
    var base={title:name,parentId:folderId,contentMimeType:'application/json',disableConversionToGoogleType:true};
    if(fa)base.base64Content={$file:{data:new Blob([json],{type:'application/json'}),name:name,type:'application/json'}};
    else{
      if(json.length>700000)throw userErr('حجم النسخة كبير على هذه الطريقة. استخدم «تنزيل نسخة كاملة» ثم ارفعها إلى درايف.');
      base.textContent=json;
    }
    return mcp.callTool(DRIVE,'create_file',base);
  });
}
function driveSay(t,bad){var m=$('#drvmsg');if(m){m.textContent=t||'';m.style.color=bad?'var(--bad,#b3261e)':'var(--muted)';}}
function driveBackup(auto){
  if(!isAdmin()||driveBusy)return;

      var f=(r&&r.payload)||{};

      return setDoc('settings','main',Object.assign({},S.settings,{lastBackup:Date.now(),driveBackup:rec}));
    });
  }).then(function(){

    var b2=$('[data-act="bk-drive"]');if(b2)b2.disabled=false;

  });

function sbDollar(txt){

  return tag+txt+tag;
}
function sbRows(){

  });

  return {rows:rows,counts:counts};

function sbChunks(rows){
  var out=[],cur=[],len=0;
  rows.forEach(function(r){
    var s=JSON.stringify(r);
    if(cur.length&&len+s.length>240000){out.push(cur);cur=[];len=0;}
    cur.push(s);len+=s.length;
  });
  if(cur.length)out.push(cur);
  return out;
}

/* reports */
function csvCell(v){
  if(typeof v==='number')return String(v);
  var s=String(v==null?'':v);
  if(/^[=+\-@\t\r]/.test(s))s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
}

    +'<section class="card" style="margin-bottom:14px"><h3>الموظفون وصلاحياتهم</h3><ol class="guide"><li>اضغط <b>إدارة الموظفين</b> وأضف بريد الموظف مع اسمه ودوره.</li><li><b>موظف</b>: يسجّل الحجوزات والعملاء وسندات القبض ولا يرى الأرباح ولا التقارير ولا الإعدادات.</li><li><b>مدير</b>: واجهة الإدارة الكاملة. <b>قراءة فقط</b>: يعرض دون تعديل.</li><li>يفتح الموظف رابط التطبيق ويدخل ببريده ثم الرمز الذي يصله. يعمل التطبيق دون إنترنت وتُرفع التعديلات تلقائياً عند عودة الاتصال.</li></ol>'
    +'<div class="acts wr" style="margin-top:10px"><button class="btn pri" data-act="staff-open">إدارة الموظفين</button></div>'
    +'<p style="color:var(--muted);margin-top:10px">زر «معاينة كموظف» في القائمة يعرض لك ما يراه الموظف.</p></section>'
    +backupCard()
    +'<section class="card flush"><h3 style="padding:16px 18px 0">نشاط الموظفين</h3>'+(empRows?'<div class="tw"><table class="tbl"><thead><tr><th>الاسم</th><th>الحجوزات</th><th>سندات القبض</th></tr></thead><tbody>'+empRows+'</tbody></table></div>':emptyBox('لا نشاط مسجّل بعد'))+'</section>';
}

/* ---------- shell, nav, rendering ---------- */
var VIEWS={reminders:viewReminders,pilgrims:viewPilgrims,audit:viewAudit,home:viewHome,bookings:viewBookings,tickets:viewTickets,customers:viewCustomers,cash:viewCash,programs:viewPrograms,suppliers:viewSuppliers,reports:viewReports,settings:viewSettings};
var LISTS={reminders:listReminders,pilgrims:listPilgrims,audit:listAudit,tickets:listTickets,bookings:listBookings,customers:listCustomers,cash:listTxns};
function navItems(){return NAV.filter(function(n){return n[3]==='all'||isAdmin();});}
function navLabel(n){return (n[0]==='cash'&&!isAdmin())?'المقبوضات':n[1];}
function navBtn(n){return '<button class="nv" data-act="go" data-id="'+n[0]+'">'+n[2]+'<span>'+esc(navLabel(n))+'</span></button>';}
function roleChip(){
  if(S.admin)return '<button class="rolechip'+(S.preview?'':' adm')+'" data-act="toggle-preview" title="تبديل المعاينة">'+(S.preview?'معاينة: موظف ↩':'الإدارة')+'</button>';
  return '<span class="rolechip">موظف</span>';
}
function chromeSig(){return [S.settings.agency,isAdmin(),S.readonly,S.me.name,S.preview].join('|');}
function shell(){
  var items=navItems(),ag=S.settings.agency||'وكالة السفر';
  var tabs=items.length>5?items.slice(0,4).map(navBtn).join('')+'<button class="nv" data-act="more">'+ICO.more+'<span>المزيد</span></button>':items.map(navBtn).join('');
  $('#app').innerHTML='<div class="shell"><aside class="side"><div class="brandrow">'+MARK+'<div><b>'+esc(ag)+'</b><small>نظام الحسابات</small></div></div><nav>'+items.map(navBtn).join('')+'</nav>'
    +'<div class="sidefoot"><div class="me"><img src="'+esc(S.me.avatarUrl||'')+'" alt="" width="32" height="32"><span>'+esc(S.me.name||'مستخدم')+'</span></div>'+roleChip()+'</div></aside>'
    +'<main class="main"><div class="mbar">'+MARK+'<b>'+esc(ag)+'</b><span class="sp"></span>'+roleChip()+'</div>'+(S.readonly?'<div class="note" style="margin:12px 16px 0">حسابك بصلاحية القراءة فقط.</div>':'')+'<div id="view"></div></main>'
    +'<nav class="tabbar">'+tabs+'</nav></div>';
  $('#root').classList.toggle('ro',S.readonly);
}
function allowed(v){var n=NAV.filter(function(x){return x[0]===v;})[0];return !!n&&(n[3]==='all'||isAdmin());}
function allReady(){return S.settingsLoaded&&['customers','suppliers','programs','bookings','txns','tickets','pilgrims'].every(function(k){return S.ready[k];});}
function updateNav(){$$('.nv[data-act="go"]').forEach(function(b){if(b.dataset.id===S.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
function renderView(){
  var v=$('#view');if(!v)return;
  if(!allReady()){v.innerHTML='<div class="empty">جارٍ التحميل…</div>';return;}
  if(!S.hasSettings&&!isAdmin()){v.innerHTML=emptyBox('لم يكتمل إعداد النظام بعد','يرجى إخبار الإدارة لإكمال إعداد الوكالة.');return;}
  if(!allowed(S.view))S.view='home';
  v.innerHTML=VIEWS[S.view]();
  updateNav();
}
function renderList(){
  var l=$('#list'),fn=LISTS[S.view];
  if(l&&fn)l.innerHTML=fn();else renderView();
}
function go(v){
  S.view=v;closeModal();
  try{history.replaceState(null,'','#'+v);}catch(e){}
  renderView();window.scrollTo(0,0);
}
var raf=0;
function refresh(){
  if(raf)return;
  raf=setTimeout(function(){
    raf=0;reindex();
    var sig=chromeSig();if(sig!==S.sig){S.sig=sig;shell();}
    var ae=document.activeElement;
    if(ae&&ae.matches&&ae.matches('[data-search]'))renderList();else renderView();
    if(allReady()&&!S.hasSettings&&isAdmin()&&!S.setupShown){S.setupShown=true;openSettingsForm(true);}
    if(allReady()&&S.ready.recurring){runRecurring();pruneAudit();}
    if(allReady()&&S.hasSettings&&isAdmin()&&S.mcp&&S.settings.driveAuto&&!S.driveAutoDone){S.driveAutoDone=true;if(Date.now()-num((S.settings.driveBackup||{}).at)>20*36e5)driveBackup(true);}
    if(allReady()&&S.hasSettings&&isAdmin()&&S.mcp&&S.settings.sbAuto&&!S.sbAutoDone){S.sbAutoDone=true;if(Date.now()-num((S.settings.sbSync||{}).at)>20*36e5)setTimeout(function(){sbSync(true);},driveBusy?8000:0);}
    ensureNames();
  },16);
}
function ensureNames(){
  if(!S.user)return;
  var ids={};
  S.bookings.forEach(function(b){if(b.by)ids[b.by]=1;});
  S.txns.forEach(function(t){if(t.by)ids[t.by]=1;});
  var miss=Object.keys(ids).filter(function(i){return !(i in S.names);});
  if(!miss.length)return;
  miss.forEach(function(i){S.names[i]=null;});
  S.user.profiles(miss).then(function(ps){miss.forEach(function(i){S.names[i]=(ps[i]&&ps[i].name)||'موظف';});refresh();},function(){miss.forEach(function(i){S.names[i]='موظف';});});
}

/* ---------- events ---------- */
var ACT={
  go:function(id){go(id);},
  more:function(){
    var rest=navItems().slice(4);

  },
  close:function(){closeModal();},
  'new-xf':function(){openTransferForm();},
  'inv-bk':function(id){openInvoice(id);},
  'rcpt-tx':function(id){openReceiptDoc(id);},
  'doc-pdf':function(){docPdfDownload();},
  'doc-share':function(){docPdfShare();},
  att:function(id,v){openAttachment(id,v);},
  'att-dl':function(){attDownload();},
  'att-share':function(){attShare();},
  'att-del':function(){attDelete();},
  'att-back':function(){var p=ATTV&&ATTV.pid;ATTV=null;if(p&&IDX.pg.get(p))openPilgrim(p);else closeModal();},
  'rm-sent':function(id){markReminder(id);},
  'rm-kind':function(id,v){S.f.rm.kind=v;renderView();},
  'rm-st':function(id,v){S.f.rm.st=v;renderView();},
  'rm-lang':function(id,v){S.f.rm.lang=v;renderView();},
  'bk-share':function(){shareBackup();},
  'bk-drive':function(){driveBackup(false);},
  'bk-sb':function(){sbSync(false);},
  'bk-sbauto':function(){toggleSbAuto();},
  'sb-pick':function(id){var k=SB_PICK;if(!k)return;SB_PICK=null;closeModal();var p=k.list[+id];if(p)k.res(p.id);else k.rej(userErr('لم يُحدَّد مشروع.'));},
  'sb-pick-cancel':function(){var k=SB_PICK;SB_PICK=null;closeModal();if(k)k.rej(userErr('أُلغي اختيار المشروع.'));},
  'bk-auto':function(){toggleDriveAuto();},
  'doc-print':function(){try{window.print();}catch(e){toast('تعذّرت الطباعة من هذه الصفحة. استخدم «تنزيل نسخة للطباعة».','bad');}},
  'doc-lang':function(id,v){if(!DOCCTX)return;var c=DOCCTX.ctx;c.lang=v;openDocModal(c);},
  'doc-save':function(){
    if(!S.dl||!DOCCTX)return;
    var i=DOCCTX.info;
    S.dl.save({filename:i.file,data:docFile(i)}).then(function(){toast('تم حفظ الملف');},function(e){if(!e||e.code!=='declined')toast('تعذّر تنزيل الملف','bad');});
  },
  'doc-back':function(){var c=DOCCTX&&DOCCTX.ctx;if(c&&c.kind==='bk')openBooking(c.id);else if(c&&c.kind==='tx')openTxn(c.id);else if(c&&c.kind==='pr')openProgram(c.id);else closeModal();},
  'new-pg':function(){openPilgrimForm(null);},
  'edit-pg':function(id){openPilgrimForm(id);},
  pg:function(id){openPilgrim(id);},
  'new-pg-bk':function(id){var b=IDX.bk.get(id);if(!b)return;closeModal();openPilgrimForm(null,{bookingId:id,customerId:b.customerId,programId:b.programId||''});},
  'new-pg-pr':function(id){closeModal();openPilgrimForm(null,{programId:id});},
  'pg-doc':function(id,v){togglePgDoc(id,v);},
  'pg-st':function(id,v){S.f.pg.st=v;renderView();},
  'pg-list':function(id){openManifest(id);},
  'go-pg':function(id){S.f.pg.pr=(id&&id!=='all')?id:'all';S.f.pg.st='docs';go('pilgrims');},
  'new-rec':function(){openRecurringForm(null);},
  'edit-rec':function(id){openRecurringForm(id);},
  'rec-list':function(){openRecurringList();},
  'new-cl':function(){openClosingForm();},
  cl:function(id){openClosing(id);},
  'cl-list':function(){openClosingsList();},
  'bk-save':function(){saveBackup();},
  bg:function(){},
  'staff-open':function(){if(window.RH)window.RH.openStaff();},
  'toggle-preview':function(){S.preview=!S.preview;if(!allowed(S.view))S.view='home';S.sig='';refresh();},
  'new-bk':function(){openBookingForm(null);},
  'edit-bk':function(id){openBookingForm(id);},
  'del-bk':function(id){deleteBooking(id);},
  bk:function(id){openBooking(id);},
  'bk-status':function(id,v){S.f.bk.status=v;renderView();},
  'pay-bk':function(id){var b=IDX.bk.get(id);openReceiptForm({customerId:b?b.customerId:'',bookingId:id});},
  'new-tk':function(){openTicketForm(null);},
  'new-tk-su':function(id){closeModal();openTicketForm(null,id);},
  'edit-tk':function(id){openTicketForm(id);},
  'del-tk':function(id){deleteTicket(id);},
  tk:function(id){openTicket(id);},
  'tk-due':function(){S.f.tk.due=!S.f.tk.due;renderView();},
  'pay-tk':function(id){var k=IDX.tk.get(id);if(k){closeModal();openAgencyPaymentForm({supplierId:k.supplierId,ticketId:id});}},
  'new-ap':function(){openAgencyPaymentForm();},
  'new-rf':function(){openTicketForm(null,null,{refund:true});},
  'refund-tk':function(id){var k=IDX.tk.get(id);if(!k)return;closeModal();openTicketForm(null,null,{refund:true,refundOf:id,passenger:k.passenger,pnr:k.pnr,ticketNo:k.ticketNo,airline:k.airline,route:k.route,travelDate:k.travelDate,supplierId:k.supplierId,origFare:k.fare,penalty:''});},
  'new-rc':function(){openReceiptForm();},
  'new-ex':function(){openPayoutForm();},
  tx:function(id){openTxn(id);},
  'del-tx':function(id){confirmBox('حذف هذا السند نهائياً؟ سيتغيّر رصيد الصندوق وحساب العميل.','حذف',function(){return delDoc('txns',id).then(function(){toast('تم الحذف');});});},
  'cb-kind':function(id,v){S.f.cb.kind=v;renderView();},
  'new-cu':function(){openCustomerForm(null);},
  'edit-cu':function(id){openCustomerForm(id);},
  cu:function(id){openCustomer(id);},
  'rc-cu':function(id){openReceiptForm({customerId:id});},
  'bk-cu':function(id){openBookingForm(null,{customerId:id});},
  'new-pr':function(){openProgramForm(null);},
  'edit-pr':function(id){openProgramForm(id);},
  pr:function(id){openProgram(id);},
  'book-pr':function(id){var p=IDX.pr.get(id);if(p)openBookingForm(null,{type:p.type,programId:id,title:p.name,travelDate:p.dep});},
  'new-su':function(){openSupplierForm(null);},
  'edit-su':function(id){openSupplierForm(id);},
  su:function(id){openSupplier(id);},
  'pay-su':function(id){closeModal();openAgencyPaymentForm({supplierId:id});},
  'edit-settings':function(){openSettingsForm(false);},
  csv:function(id,v){exportCsv(v);},
  'form-del':function(){
    if(!CUR||!CUR.cfg.onDelete)return;
    var fn=CUR.cfg.onDelete;closeModal();fn();
  }
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='modal'&&e.target.dataset.dismiss)closeModal();return;}
  if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();
  var a=el.dataset.act;
  if(a==='bg')return;
  var fn=ACT[a];if(fn){fn(el.dataset.id,el.dataset.v,el,e);}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.search){S.f[t.dataset.search].q=t.value;renderList();}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='attf'){var fl2=Array.prototype.slice.call(t.files||[]),pid2=t.dataset.pid,kd=($('#attk')||{}).value||'other';t.value='';if(fl2&&fl2.length)uploadAttachments(pid2,kd,fl2);return;}
  if(t.id==='restoreFile'){var fl=t.files&&t.files[0];t.value='';if(fl){if(fl.size>20*1024*1024){toast('الملف كبير جداً','bad');return;}var rd=new FileReader();rd.onload=function(){askRestore(String(rd.result||''));};rd.onerror=function(){toast('تعذّرت قراءة الملف','bad');};rd.readAsText(fl);}return;}
  if(!t.dataset||!t.dataset.sel)return;
  var k=t.dataset.sel;
  if(k==='bk-type')S.f.bk.type=t.value;
  else if(k==='tk-ag')S.f.tk.ag=t.value;
  else if(k==='cb-period')S.f.cb.period=t.value;
  else if(k==='rp-period')S.f.rp.period=t.value;
  else if(k==='rp-from')S.f.rp.from=t.value;
  else if(k==='rp-to')S.f.rp.to=t.value;
  else if(k==='pg-pr')S.f.pg.pr=t.value;
  else if(k==='au-coll')S.f.au.coll=t.value;
  renderView();
});
$('#modal').addEventListener('submit',function(e){e.preventDefault();submitForm();});
function formEvt(e){
  if(!CUR)return;
  var el=e.target;if(!el.id||el.id.indexOf('f_')!==0)return;
  var k=el.id.slice(2);
  if((e.type==='input'&&el.tagName!=='SELECT')||(e.type==='change'&&el.tagName==='SELECT'))CUR.api.dirty[k]=true;
  applyShowIf();
  if(CUR.onChange)CUR.onChange(CUR.api,k);
}
$('#modal').addEventListener('input',formEvt);
$('#modal').addEventListener('change',formEvt);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#modal').hidden&&$('#modal').dataset.dismiss)closeModal();});

/* ---------- start ---------- */
function fatal(msg){$('#boot').innerHTML=msg;}
function sub(name,key){
  S.db.collection(name).onSnapshot(function(snap){
    S[key]=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o;});
    S.ready[key]=true;S.rev++;refresh();
  },function(){S.ready[key]=true;refresh();});
}
function start(){
  if(!window.claude||!window.claude.use){fatal('تعذّر بدء التطبيق. أعد تحميل الصفحة.');return;}
  Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('downloads')]).then(function(r){
    S.db=r[0];S.user=r[1];S.dl=r[2];
    try{window.claude.use('mcp').then(function(m){S.mcp=m||null;S.rev++;refresh();},function(){S.mcp=null;});}catch(e){S.mcp=null;}
    if(!S.db){fatal('تعذّر فتح قاعدة البيانات. أعد تحميل الصفحة.');return null;}
    var u=S.user;
    return Promise.all([u?u.canEdit():false,u?u.me():null,u?u.can('data.write'):null]).then(function(x){
      S.admin=!!x[0];
      if(x[1]){S.me=x[1];S.uid=x[1].id;}
      S.readonly=x[2]===false;
      if(S.uid&&S.me.name)S.names[S.uid]=S.me.name;
      var h=(location.hash||'').replace('#','');if(VIEWS[h])S.view=h;
      $('#boot').hidden=true;$('#app').hidden=false;
      S.sig=chromeSig();shell();renderView();
      S.db.doc('settings/main').onSnapshot(function(snap){
        S.hasSettings=snap.exists;S.settings=snap.exists?snap.data():{};S.settingsLoaded=true;S.rev++;refresh();
      },function(){S.settingsLoaded=true;refresh();});
      sub('customers','customers');sub('suppliers','suppliers');sub('programs','programs');sub('bookings','bookings');sub('txns','txns');sub('tickets','tickets');sub('pilgrims','pilgrims');sub('reminders','reminders');
      if(S.admin){
        sub('recurring','recurring');sub('closings','closings');
        S.db.collection('audit').orderBy('at','desc').limit(300).onSnapshot(function(snap){S.audit=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o;});S.ready.audit=true;S.rev++;refresh();},function(){S.ready.audit=true;});
      }
    });
  }).catch(function(){fatal('تعذّر فتح التطبيق. أعد تحميل الصفحة.');});
}
start();
})();
